name: CI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: paisa_ci
          MYSQL_USER: paisa
          MYSQL_PASSWORD: paisa
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upaisa -ppaisa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://paisa:paisa@127.0.0.1:3306/paisa_ci
      RUN_PRISMA_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace @paisa/api run prisma:deploy
      - run: npm --workspace @paisa/api run seed
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx --workspace @paisa/api prisma validate

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
