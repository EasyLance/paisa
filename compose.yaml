services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: paisa
      MYSQL_USER: paisa
      MYSQL_PASSWORD: paisa
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - paisa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-only"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - paisa_redis:/data
volumes:
  paisa_mysql:
  paisa_redis:
