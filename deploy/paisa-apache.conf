# Apache vhost for Paisa — single subdomain, same-origin.
#
# The dashboard and the API share one hostname: Apache serves the dashboard and
# forwards the API paths to it. That means the browser never makes a cross-origin
# request, so there is no CORS preflight to misconfigure.
#
# Install:
#   sudo cp deploy/paisa-apache.conf /etc/apache2/sites-available/paisa.conf
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite paisa
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d paisa.example.com     # adds the TLS vhost + redirect
#
# Replace paisa.example.com with your subdomain before installing.

<VirtualHost *:80>
    ServerName paisa.example.com

    ProxyPreserveHost On
    ProxyTimeout 30
    # Never act as a forward proxy.
    ProxyRequests Off

    # --- API (must be listed before the catch-all below) ---
    ProxyPass        /v1     http://127.0.0.1:4000/v1
    ProxyPassReverse /v1     http://127.0.0.1:4000/v1
    ProxyPass        /health http://127.0.0.1:4000/health
    ProxyPassReverse /health http://127.0.0.1:4000/health
    ProxyPass        /ready  http://127.0.0.1:4000/ready
    ProxyPassReverse /ready  http://127.0.0.1:4000/ready

    # /docs (the OpenAPI browser) is deliberately NOT proxied. It describes every
    # endpoint of a private financial API and has no business being public. Reach
    # it over SSH instead:  ssh -L 4000:127.0.0.1:4000 you@your-vps
    # then open http://localhost:4000/docs

    # --- Dashboard ---
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Statement files are fingerprinted in the browser before upload; 12M leaves
    # room above the API's own 10 MB limit so oversized files fail with the API's
    # message rather than an opaque Apache error.
    LimitRequestBody 12582912

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog  ${APACHE_LOG_DIR}/paisa-error.log
    CustomLog ${APACHE_LOG_DIR}/paisa-access.log combined
</VirtualHost>
